apiVersion: v1
kind: Service
metadata:
  name: "{{ include "dev-env.fullname" . }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "dev-env.labels" . | nindent 4 }}
spec:
  internalTrafficPolicy: Cluster
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    {{- include "dev-env.selector-labels" . | nindent 4 }}
  type: ClusterIP
