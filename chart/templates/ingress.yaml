{{- $ingress := .Values.ingress | default dict }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ include "dev-env.fullname" . }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "dev-env.labels" . | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: "{{ . }}"
  {{- end }}
  rules:
    - host: "{{ .Values.host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ include "dev-env.fullname" . }}"
                port:
                  name: http
  tls:
    {{- with $ingress.tlsSecretName }}
    - hosts:
        - "{{ $.Values.host }}"
      secretName: "{{ . }}"
    {{- else }}
    - {}
    {{- end }}
