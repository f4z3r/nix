name: Publish dev image

on:
  push:
    tags:
      - "v**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dev-environment

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build image
        run: nix build .#dev-image

      - name: Publish image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="${IMAGE,,}"
          tag="${GITHUB_REF_NAME}"

          nix shell --inputs-from . nixpkgs#skopeo -c \
            skopeo copy \
              --dest-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              "docker-archive:${PWD}/result" \
              "docker://${image}:${tag}"

          nix shell --inputs-from . nixpkgs#skopeo -c \
            skopeo copy \
              --src-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              --dest-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              "docker://${image}:${tag}" \
              "docker://${image}:latest"
